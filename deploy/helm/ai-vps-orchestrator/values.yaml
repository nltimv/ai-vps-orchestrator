# -- Image settings. Tags default to the chart's appVersion: a released chart runs exactly the images
#    of its own release, so `helm upgrade --version X` moves everything to release X.
#    pullPolicy "" leaves it to Kubernetes: IfNotPresent for version tags, Always for "latest".
image:
  backend:
    repository: ghcr.io/nltimv/aivo-backend
    tag: ""          # defaults to the chart appVersion
    pullPolicy: ""
  frontend:
    repository: ghcr.io/nltimv/aivo-frontend
    tag: ""
    pullPolicy: ""
  # the image RunPod runs on the GPUs (not a pod in this cluster)
  worker:
    repository: ghcr.io/nltimv/aivo-worker
    tag: ""          # defaults to the chart appVersion
imagePullSecrets: []

# -- runpod = RunPod Serverless; fake = a simulated RunPod inside the backend (demos, no GPUs)
provider: runpod
# -- RunPod Serverless. The API key goes in secrets.runpodApiKey. Workers deliver results to publicUrl
#    (or workerApiUrl), so the dashboard must be reachable from the internet (only /api/v1/worker/ is used,
#    with a one-time ticket per job).
runpod:
  countries: []              # ISO codes where workers may run; empty = the built-in European list
  dataCenters: []            # or exact data centers, e.g. [EU-NL-1, EU-RO-1] (overrides countries)
  globalVolumeId: ""         # keeps model files for every worker, in any data center (recommended)
  networkVolumeId: ""        # or: keeps them in one data center only (pins workers there); not both
  gpuTypes: []               # only these GPU types (RunPod names); empty = all
  diskGb: 150                # container disk for model files without a network volume
  region: eu                 # name shown in aivo for RunPod GPUs
  workerApiUrl: ""           # where workers reach aivo; empty = publicUrl
# -- Pin the worker image RunPod runs (full reference). Empty = image.worker at the release's version.
workerImage: ""

# -- Secrets. Either let the chart create one from these values, or point at an existing Secret
#    with keys: AIVO_MEDIA_KEKS, AIVO_RUNPOD_API_KEY, [AIVO_HF_TOKEN, AIVO_ADMIN_PASSWORD, AIVO_DATABASE_URL]
secrets:
  existingSecret: ""
  mediaKeks: ""            # `aivo generate-key` -> "k1:<base64>"; back it up, it decrypts the gallery
  mediaActiveKeyId: ""
  runpodApiKey: ""         # RunPod console -> Settings -> API keys (Serverless read/write)
  hfToken: ""
  adminEmail: ""
  adminPassword: ""

# -- Public URL of the dashboard (used for the SSO redirect URI).
#    Defaults to https://<ingress.host> when the Ingress is enabled.
publicUrl: ""
# -- Allow email + password sign-in (set false for SSO-only)
passwordLogin: true

# -- Single sign-on (OpenID Connect). Redirect URI to register: <publicUrl>/api/v1/auth/oidc/callback
sso:
  enabled: false
  issuer: ""                 # e.g. https://sso.example.com/realms/home
  clientId: ""
  clientSecret: ""           # stored in the chart Secret; or AIVO_OIDC_CLIENT_SECRET in secrets.existingSecret
  name: SSO                  # button text: "Continue with <name>"
  scopes: "openid email profile"
  autoProvision: true        # false = only people with an invite link may join
  linkByEmail: true          # link SSO to an existing account with the same *verified* email
  allowedDomains: []         # e.g. [example.com]
  allowedGroups: []          # e.g. [aivo-users]
  adminGroups: []            # e.g. [aivo-admins]; admin role then follows group membership
  groupsClaim: groups

# -- combined: one pod runs API + controller (works with a ReadWriteOnce media volume; recommended)
#    split: separate API and controller pods (both mount the media volume -> needs ReadWriteMany)
topology: combined

# -- API pods (split topology)
api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# -- Controller: exactly one active instance (lease-protected); Recreate on upgrade
controller:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

frontend:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# -- Encrypted media volume: the ONLY place generated content is stored (ciphertext only).
media:
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""       # any storage you control; content is encrypted before it reaches the disk
    accessModes: [ReadWriteOnce]
    size: 50Gi

# -- RAM-backed scratch for transient plaintext (thumbnails); never written to disk
scratch:
  sizeLimit: 2Gi

# -- Database: bundled PostgreSQL (official image) or an external DSN
postgresql:
  enabled: true
  image: postgres:17-alpine
  storageClass: ""
  size: 10Gi
  password: ""             # generated if empty
externalDatabase:
  # e.g. a managed database's connection string as given: postgresql://user:pass@host:25060/aivo?sslmode=require
  # (postgresql+asyncpg://…?ssl=require also works), or via existingSecret AIVO_DATABASE_URL
  url: ""

# -- Backstop that destroys idle/expired machines if the controller is down
janitor:
  enabled: true
  schedule: "*/5 * * * *"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt
  # RunPod workers upload finished videos through the ingress: allow large bodies, e.g. for ingress-nginx
  # nginx.ingress.kubernetes.io/proxy-body-size: "4g"
  # nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  host: aivo.example.com
  tls:
    enabled: true
    secretName: aivo-tls

# -- Gateway API alternative to Ingress
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []

networkPolicy:
  enabled: true

extraEnv: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001    # the image's `aivo` user; a numeric id is required to verify runAsNonRoot
  runAsGroup: 10001
  fsGroup: 10001
nodeSelector: {}
tolerations: []
affinity: {}
