{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.mediaKeks }}
{{- fail "secrets.mediaKeks is required (run `aivo generate-key`), or set secrets.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aivo.secretName" . }}
  labels: {{- include "aivo.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIVO_MEDIA_KEKS: {{ .Values.secrets.mediaKeks | quote }}
  {{- with .Values.secrets.doToken }}
  AIVO_DO_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.doWatchdogToken }}
  AIVO_DO_WATCHDOG_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.spacesKey }}
  AIVO_SPACES_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.spacesSecret }}
  AIVO_SPACES_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.hfToken }}
  AIVO_HF_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.sso.clientSecret }}
  AIVO_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  AIVO_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
