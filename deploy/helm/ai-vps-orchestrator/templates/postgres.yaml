{{- if .Values.postgresql.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" (include "aivo.fullname" .)) }}
{{- $pw := .Values.postgresql.password | default (ternary (index ($existing.data | default dict) "password" | default "" | b64dec) "" (not (empty $existing))) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aivo.fullname" . }}-postgres
  labels: {{- include "aivo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $pw | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aivo.fullname" . }}-postgres
  labels: {{- include "aivo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "aivo.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "aivo.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels: {{- include "aivo.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 70, fsGroup: 70 }
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          env:
            - { name: POSTGRES_USER, value: aivo }
            - { name: POSTGRES_DB, value: aivo }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "aivo.fullname" . }}-postgres, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "aivo"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aivo.fullname" . }}-postgres
  labels: {{- include "aivo.labels" . | nindent 4 }}
spec:
  selector: {{- include "aivo.selector" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - { name: pg, port: 5432, targetPort: pg }
{{- end }}
