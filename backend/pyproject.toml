[project]
name = "aivo-backend"
version = "0.1.0"
description = "aivo backend: API, controller, provider integrations, encrypted media store"
requires-python = ">=3.12"
dependencies = [
  "aivo-protocol",
  "aivo-worker",          # in-process mock workers for the fake provider
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pyyaml>=6",
  "typer>=0.12",
  "sse-starlette>=2.1",
  "pillow>=11",
  "python-multipart>=0.0.12",
  "jinja2>=3.1",
  "boto3>=1.35",
  "pyjwt[crypto]>=2.9",
]

[project.scripts]
aivo = "aivo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivo"]
