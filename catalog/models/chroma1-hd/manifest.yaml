id: chroma1-hd
kind: image
adult: true
display_name: "Image · Unrestricted (18+)"
tagline: "Realistic or illustrated pictures without content filtering, for adults"
description: >
  Chroma1-HD (8.9B, by lodestones, based on FLUX.1 [schnell]), trained without content
  filtering. Only shown to accounts with adult content switched on.
family: generic
license:
  name: Apache-2.0
  url: https://huggingface.co/lodestones/Chroma1-HD
  commercial: true
supports: {avoid: true, seed: true}
modes:
  - {mode: t2i, workflow: workflows/t2i.json}
# improve the description on the GPU first (catalog/rewriting.yaml)
rewrite: {t2i: image}
variants:
  - id: fp8
    precision: fp8
    min_vram_gb: 16
    recommended_vram_gb: 24
    min_ram_gb: 32
    quality_rank: 2
    files: [unet_fp8, te_fp8, vae]
    params: {unet: Chroma1-HD-fp8mixed.safetensors, te: t5xxl_fp8_e4m3fn_scaled.safetensors}
  - id: bf16
    precision: bf16
    min_vram_gb: 32
    recommended_vram_gb: 48
    min_ram_gb: 64
    quality_rank: 3
    files: [unet_bf16, te_fp16, vae]
    params: {unet: Chroma1-HD.safetensors, te: t5xxl_fp16.safetensors}
files:
  # sizes checked against the Hugging Face API, Nov 2026
  - {id: unet_fp8, repo: Comfy-Org/Chroma1-HD, path: split_files/diffusion_models/Chroma1-HD-fp8mixed.safetensors,
     dest: diffusion_models/Chroma1-HD-fp8mixed.safetensors, bytes: 9193379316}
  - {id: unet_bf16, repo: Comfy-Org/Chroma1-HD, path: split_files/diffusion_models/Chroma1-HD.safetensors,
     dest: diffusion_models/Chroma1-HD.safetensors, bytes: 17800038288}
  - {id: te_fp8, repo: comfyanonymous/flux_text_encoders, path: t5xxl_fp8_e4m3fn_scaled.safetensors,
     dest: text_encoders/t5xxl_fp8_e4m3fn_scaled.safetensors, bytes: 5157348688}
  - {id: te_fp16, repo: comfyanonymous/flux_text_encoders, path: t5xxl_fp16.safetensors,
     dest: text_encoders/t5xxl_fp16.safetensors, bytes: 9787841024}
  # the FLUX.1 VAE: the same file "Image · Fast" uses
  - {id: vae, repo: Comfy-Org/z_image_turbo, path: split_files/vae/ae.safetensors,
     dest: vae/ae.safetensors, bytes: 335304388}
quality:
  draft:
    label: Draft
    params: {steps: 16, cfg: 3.8}
    sizes: {square: [1024, 1024], portrait: [832, 1216], landscape: [1216, 832], wide: [1344, 768]}
  standard:
    label: Standard
    params: {steps: 26, cfg: 3.8}
    sizes: {square: [1024, 1024], portrait: [832, 1216], landscape: [1216, 832], wide: [1344, 768]}
  best:
    label: Best
    params: {steps: 40, cfg: 3.8}
    sizes: {square: [1152, 1152], portrait: [896, 1344], landscape: [1344, 896], wide: [1536, 864]}
    prefer_variants: [bf16]
bench:
  unit: image
  seconds: {rtx4000ada: 55, l40s: 22, rtx6000ada: 20, h100: 9, h200: 8}
  model_init_s: 30
defaults:
  # the model author's negative prompt, plus terms that keep adults adult
  negative: >-
    low quality, ugly, unfinished, out of focus, deformed, disfigured, blurry, smudged,
    restricted palette, flat colors, child, minor, teen, childlike, young-looking
max_batch: 4  # per run; a creation may have more (made one batch after another)
output_mb: 2.0
tags: [adult]
notes: >
  Workflow follows the model author's ComfyUI workflow (ComfyUI_Chroma1-HD_T2I-workflow.json in
  lodestones/Chroma1-HD): T5 with padding masked (T5TokenizerOptions 0/0), AuraFlow shift 1, beta
  schedule (alpha/beta 0.45), CFG 3.8, euler. The fp8mixed file is ComfyUI's own repackaging.
