id: qwen-image-2512
kind: image
display_name: "Image · Text & posters"
tagline: "Best at readable text, signs, posters and layouts"
description: >
  Qwen-Image-2512 (20B). Top open model for typography and complex compositions.
  Draft uses a Lightning speed-up; Standard/Best run the full model.
family: generic
license:
  name: Apache-2.0
  url: https://huggingface.co/Qwen/Qwen-Image-2512
  commercial: true
supports: {avoid: true, seed: true}
modes:
  - {mode: t2i, workflow: workflows/t2i.json}
# improve the description on the GPU first (catalog/rewriting.yaml)
rewrite: {t2i: image}
variants:
  - id: fp8
    precision: fp8
    min_vram_gb: 24
    recommended_vram_gb: 40
    min_ram_gb: 48
    quality_rank: 2
    files: [unet_fp8, te, vae, lightning]
    params: {unet: qwen_image_2512_fp8_e4m3fn.safetensors}
  - id: bf16
    precision: bf16
    min_vram_gb: 64
    recommended_vram_gb: 80
    min_ram_gb: 96
    quality_rank: 3
    files: [unet_bf16, te, vae, lightning]
    params: {unet: qwen_image_2512_bf16.safetensors}
files:
  - {id: unet_fp8, repo: Comfy-Org/Qwen-Image_ComfyUI, path: split_files/diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors,
     dest: diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors, bytes: 20430000000}
  - {id: unet_bf16, repo: Comfy-Org/Qwen-Image_ComfyUI, path: split_files/diffusion_models/qwen_image_2512_bf16.safetensors,
     dest: diffusion_models/qwen_image_2512_bf16.safetensors, bytes: 40860000000}
  - {id: te, repo: Comfy-Org/Qwen-Image_ComfyUI, path: split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors,
     dest: text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors, bytes: 9380000000}
  - {id: vae, repo: Comfy-Org/Qwen-Image_ComfyUI, path: split_files/vae/qwen_image_vae.safetensors,
     dest: vae/qwen_image_vae.safetensors, bytes: 254000000}
  - {id: lightning, repo: lightx2v/Qwen-Image-Lightning, path: Qwen-Image-Lightning-8steps-V2.0.safetensors,
     dest: loras/Qwen-Image-Lightning-8steps-V2.0.safetensors, bytes: 1700000000}
quality:
  draft:
    label: Draft
    params: {steps: 8, cfg: 1.0, lora_strength: 1.0}
    sizes: {square: [1024, 1024], portrait: [864, 1152], landscape: [1152, 864], wide: [1280, 720]}
  standard:
    label: Standard
    params: {steps: 25, cfg: 3.5, lora_strength: 0.0}
    sizes: {square: [1328, 1328], portrait: [1140, 1472], landscape: [1472, 1140], wide: [1664, 928]}
  best:
    label: Best
    params: {steps: 40, cfg: 4.0, lora_strength: 0.0}
    sizes: {square: [1328, 1328], portrait: [1140, 1472], landscape: [1472, 1140], wide: [1664, 928]}
bench:
  unit: image
  seconds: {l40s: 45, rtx6000ada: 45, h100: 18, h200: 16}
  quality_factor: {draft: 0.3, standard: 1.0, best: 1.6}
  model_init_s: 40
defaults: {shift: 3.1, negative: "blurry, low quality, distorted text, watermark"}
output_mb: 2.5
tags: [text, posters]
notes: "Lightning LoRA was trained on the original Qwen-Image; verify it on 2512 or switch to a 2512-specific one."
