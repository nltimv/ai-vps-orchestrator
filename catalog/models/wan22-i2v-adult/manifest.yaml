id: wan22-i2v-adult
kind: video
adult: true
display_name: "Video · Animate (18+)"
tagline: "Brings a picture you made here to life, without content filtering"
description: >
  Wan 2.2 A14B image-to-video with a community add-on trained on adult content. It starts from a
  picture made in aivo from a text description, never from an uploaded photo. Only shown to
  accounts with adult content switched on.
family: cinematic
license:
  name: "Apache-2.0 (Wan 2.2); adult add-on: no license stated"
  url: https://huggingface.co/lopi999/Wan2.2-I2V_General-NSFW-LoRA
  commercial: false
  summary: The adult add-on is a community model without a stated license, so personal use only.
supports: {avoid: true, seed: true, sound: false}
modes:
  - {mode: i2v, workflow: workflows/i2v.json}
# improve the description on the GPU first (catalog/rewriting.yaml)
rewrite: {i2v: animate}
variants:
  - id: fp8
    precision: fp8
    min_vram_gb: 40
    recommended_vram_gb: 48
    min_ram_gb: 64
    quality_rank: 2
    files: [i2v_high_fp8, i2v_low_fp8, i2v_lora_high, i2v_lora_low, adult_high, adult_low, te, vae, interp]
    params:
      i2v_high: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
      i2v_low: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
  - id: fp16
    precision: fp16
    min_vram_gb: 70
    recommended_vram_gb: 80
    min_ram_gb: 128
    quality_rank: 3
    files: [i2v_high_fp16, i2v_low_fp16, i2v_lora_high, i2v_lora_low, adult_high, adult_low, te, vae, interp]
    params:
      i2v_high: wan2.2_i2v_high_noise_14B_fp16.safetensors
      i2v_low: wan2.2_i2v_low_noise_14B_fp16.safetensors
files:
  # the same Wan 2.2 files as "Video · Cinematic" (shared on the machine), plus the adult add-on
  - {id: i2v_high_fp8, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors,
     dest: diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors, bytes: 14300000000}
  - {id: i2v_low_fp8, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors,
     dest: diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors, bytes: 14300000000}
  - {id: i2v_high_fp16, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp16.safetensors,
     dest: diffusion_models/wan2.2_i2v_high_noise_14B_fp16.safetensors, bytes: 28600000000}
  - {id: i2v_low_fp16, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp16.safetensors,
     dest: diffusion_models/wan2.2_i2v_low_noise_14B_fp16.safetensors, bytes: 28600000000}
  - {id: i2v_lora_high, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors,
     dest: loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors, bytes: 1230000000}
  - {id: i2v_lora_low, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors,
     dest: loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors, bytes: 1230000000}
  - {id: adult_high, repo: lopi999/Wan2.2-I2V_General-NSFW-LoRA, path: NSFW-22-H-e8.safetensors,
     dest: loras/wan2.2_i2v_general_nsfw_high_e8.safetensors, bytes: 613516752}
  - {id: adult_low, repo: lopi999/Wan2.2-I2V_General-NSFW-LoRA, path: NSFW-22-L-e8.safetensors,
     dest: loras/wan2.2_i2v_general_nsfw_low_e8.safetensors, bytes: 613516752}
  - {id: te, repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged, path: split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors,
     dest: text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors, bytes: 6740000000}
  - {id: vae, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/vae/wan_2.1_vae.safetensors,
     dest: vae/wan_2.1_vae.safetensors, bytes: 254000000}
  - {id: interp, repo: Comfy-Org/Frame-Interpolation, path: frame_interpolation/film_net_fp16.safetensors,
     dest: frame_interpolation/film_net_fp16.safetensors, bytes: 68882302}
quality:
  # One workflow, three passes (see workflows/): the presets set where each pass ends.
  draft:
    label: Draft
    # the 4-step speed-up (Lightx2v) at 480p
    params: {steps: 4, guided_steps: 1, split_step: 2, cfg_guided: 1.0, cfg: 1.0, guided_lora: 1.0, lora_strength: 1.0, adult_strength: 1.0}
    sizes: {"9x16": [480, 832], square: [640, 640], wide: [832, 480]}
  standard:
    label: Standard
    # the 4-step speed-up at 720p: quick and cheap, but motion can be timid
    params: {steps: 4, guided_steps: 1, split_step: 2, cfg_guided: 1.0, cfg: 1.0, guided_lora: 1.0, lora_strength: 1.0, adult_strength: 1.0}
    sizes: {"9x16": [720, 1280], square: [960, 960], wide: [1280, 720]}
  high:
    label: High
    # middle way: the full model guides the first 2 of 8 steps (motion, layout), the speed-up does the rest.
    # ~10 model passes instead of 4 (speed-up) or 40 (full model)
    params: {steps: 8, guided_steps: 2, split_step: 4, cfg_guided: 3.5, cfg: 1.0, guided_lora: 0.0, lora_strength: 1.0, adult_strength: 1.0}
    sizes: {"9x16": [720, 1280], square: [960, 960], wide: [1280, 720]}
  best:
    label: Best
    # the full model, as in ComfyUI's official Wan 2.2 template: 20 steps with CFG
    params: {steps: 20, guided_steps: 5, split_step: 10, cfg_guided: 3.5, cfg: 3.5, guided_lora: 0.0, lora_strength: 0.0, adult_strength: 1.0}
    sizes: {"9x16": [720, 1280], square: [960, 960], wide: [1280, 720]}
video:
  fps: 16
  interpolate: 2  # FILM doubles it to 32 fps after creating: smoother motion
  frame_multiple: 4
  frame_offset: 1
  durations: {short: 5, medium: 8}
  max_seconds: 8
bench:
  unit: video_second
  # seconds per second of video at Standard (4-step speed-up, 720p). Measured on RunPod, Nov 2026, on an
  # RTX PRO 6000: Standard 17 s, the full model 154 s; the others scaled from it.
  seconds: {l40s: 24, rtx6000ada: 24, rtxpro6000: 17, h100: 10, h200: 9.5}
  quality_factor: {draft: 0.35, standard: 1.0, high: 2.5, best: 9.0}
  model_init_s: 60
# the add-on's trigger word
prompt_prefix: nsfwsks
defaults:
  shift: 5.0
  negative: >-
    blurry, low quality, static, distorted, jpeg artifacts, watermark, text, ugly,
    child, minor, teen, childlike, young-looking
max_batch: 1  # per run; a creation may have more (made one batch after another)
output_mb: 8
tags: [video, adult]
notes: >
  "Video · Cinematic" (wan22-a14b) image-to-video graph with the adult add-on (HF mirror of
  civitai.com/models/1307155, trigger word nsfwsks) chained after the Lightx2v speed-up add-on on
  both the high- and low-noise expert.
