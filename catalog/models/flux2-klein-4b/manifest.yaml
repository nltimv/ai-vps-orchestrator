id: flux2-klein-4b
kind: image
display_name: "Image · Quick edits"
tagline: "Fast pictures and quick edits on the smallest machine"
description: >
  FLUX.2 [klein] 4B: a small, distilled FLUX.2 that both creates and edits
  images in a few steps. Fits a 20 GB GPU.
family: generic
license:
  name: Apache-2.0
  url: https://huggingface.co/black-forest-labs/FLUX.2-klein-4B
  commercial: true
supports: {avoid: false, seed: true}
modes:
  - {mode: t2i, workflow: workflows/t2i.json}
  - {mode: edit, workflow: workflows/edit.json}
variants:
  - id: bf16
    precision: bf16
    min_vram_gb: 13
    recommended_vram_gb: 18
    min_ram_gb: 24
    quality_rank: 1
    files: [unet, te, vae]
files:
  - {id: unet, repo: Comfy-Org/flux2-klein, path: split_files/diffusion_models/flux-2-klein-4b.safetensors,
     dest: diffusion_models/flux-2-klein-4b.safetensors, bytes: 7750000000}
  - {id: te, repo: Comfy-Org/z_image_turbo, path: split_files/text_encoders/qwen_3_4b.safetensors,
     dest: text_encoders/qwen_3_4b.safetensors, bytes: 8040000000}
  - {id: vae, repo: Comfy-Org/flux2-dev, path: split_files/vae/flux2-vae.safetensors,
     dest: vae/flux2-vae.safetensors, bytes: 336000000}
quality:
  draft:
    label: Draft
    params: {steps: 4, megapixels: 0.6}
    sizes: {square: [768, 768], portrait: [640, 960], landscape: [960, 640], wide: [1024, 576]}
  standard:
    label: Standard
    params: {steps: 4, megapixels: 1.0}
    sizes: {square: [1024, 1024], portrait: [832, 1216], landscape: [1216, 832], wide: [1344, 768]}
  best:
    label: Best
    params: {steps: 6, megapixels: 1.5}
    sizes: {square: [1280, 1280], portrait: [1024, 1536], landscape: [1536, 1024], wide: [1600, 896]}
bench:
  unit: image
  seconds: {rtx4000ada: 6, l40s: 2.5, rtx6000ada: 2.5, h100: 1.2, h200: 1.1}
  model_init_s: 20
output_mb: 1.6
tags: [fast, edit]
