id: wan22-ti2v-5b
kind: video
display_name: "Video · Budget"
tagline: "Decent 720p clips on the cheapest machine"
description: >
  Wan 2.2 TI2V-5B: a compact text/image-to-video model at 720p, 24 fps, that
  fits a 20 GB GPU (with partial offloading).
family: cinematic
license:
  name: Apache-2.0
  url: https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B
  commercial: true
supports: {avoid: true, seed: true, sound: false}
modes:
  - {mode: t2v, workflow: workflows/t2v.json}
  - {mode: i2v, workflow: workflows/i2v.json}
# improve the description on the GPU first (catalog/rewriting.yaml)
rewrite: {t2v: video, i2v: animate}
variants:
  - id: fp16
    precision: fp16
    min_vram_gb: 16
    recommended_vram_gb: 24
    min_ram_gb: 32
    quality_rank: 1
    files: [unet, te, vae]
files:
  - {id: unet, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors,
     dest: diffusion_models/wan2.2_ti2v_5B_fp16.safetensors, bytes: 9990000000}
  - {id: te, repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged, path: split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors,
     dest: text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors, bytes: 6740000000}
  - {id: vae, repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/vae/wan2.2_vae.safetensors,
     dest: vae/wan2.2_vae.safetensors, bytes: 1410000000}
quality:
  draft:
    label: Draft
    params: {steps: 12, cfg: 5.0}
    sizes: {square: [704, 704], portrait: [544, 960], landscape: [960, 544], wide: [960, 544]}
  standard:
    label: Standard
    params: {steps: 20, cfg: 5.0}
    sizes: {square: [960, 960], portrait: [704, 1280], landscape: [1280, 704], wide: [1280, 704]}
  best:
    label: Best
    params: {steps: 30, cfg: 5.0}
    sizes: {square: [960, 960], portrait: [704, 1280], landscape: [1280, 704], wide: [1280, 704]}
video:
  fps: 24
  frame_multiple: 4
  frame_offset: 1
  durations: {short: 5, medium: 8}
  max_seconds: 8
bench:
  unit: video_second
  seconds: {rtx4000ada: 60, l40s: 20, rtx6000ada: 20, h100: 8, h200: 7.5}
  model_init_s: 30
defaults:
  shift: 8.0
  negative: "blurry, low quality, static, distorted, watermark, text"
max_count: 1
output_mb: 6
tags: [video, budget]
