[project]
name = "aivo-protocol"
version = "0.1.0"
description = "Shared contracts between the aivo backend and GPU worker agent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivo_protocol"]
