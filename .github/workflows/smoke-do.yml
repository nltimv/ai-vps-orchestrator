# Real GPU smoke test on DigitalOcean. Costs money: manual trigger only, with a hard cap.
name: smoke-digitalocean

on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: Hard spending cap for this run (USD)
        default: "1.50"
      model:
        description: Engine to test
        default: z-image-turbo

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: digitalocean   # protect with required reviewers
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen
      - name: smoke test
        env:
          AIVO_DO_TOKEN: ${{ secrets.DO_TOKEN }}
          AIVO_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/aivo-worker:latest
        run: >
          uv run python scripts/do_smoke.py --max-usd "${{ inputs.max_usd }}" --model "${{ inputs.model }}"
          --i-understand-this-costs-money --report smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-report, path: smoke-report.json }
