# Release: every push to main builds all images and the Helm chart under ONE version,
#   <VERSION file>.<build number>   e.g. 0.2.57
# The build number is this workflow's run number, so versions only go up and every merge is a new release.
# Bump MAJOR.MINOR by editing the VERSION file.
#
# Published:
#   ghcr.io/<owner>/aivo-{backend,frontend,worker,worker-mock}:<version>   (+ :latest and :sha-<commit> on main)
#   oci://ghcr.io/<owner>/charts/ai-vps-orchestrator  --version <version> (appVersion = <version>)
#   git tag v<version>
# The chart runs exactly the images of its own release, and the backend gives GPU machines the worker image
# of that same release, so `helm upgrade --version <new>` moves dashboard, controller and workers together.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false  # releases go out in order

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          BUILD: ${{ github.run_number }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR (e.g. 0.2), got '$base'"
            exit 1
          fi
          version="$base.$BUILD"
          latest=false
          if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            latest=true
          else  # a manual run from another branch: a pre-release that sorts below the next real release
            branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//' | cut -c1-30)"
            version="$version-$branch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "### aivo $version" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: aivo-backend, dockerfile: backend/Dockerfile }
          - { name: aivo-frontend, dockerfile: frontend/Dockerfile }
          - { name: aivo-worker-mock, dockerfile: worker/Dockerfile.mock }
          - { name: aivo-worker, dockerfile: worker/Dockerfile, gpu: true }
    steps:
      - uses: actions/checkout@v4
      # the CUDA/PyTorch worker image is large: free runner disk first
      - if: matrix.gpu
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.version.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha
            type=raw,value=latest,enable=${{ needs.version.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: AIVO_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    needs: [version, images]  # only publish a chart whose images exist
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the git tag
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ needs.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package
        run: |
          chart=deploy/helm/ai-vps-orchestrator
          # images of this repository's owner (forks publish their own)
          sed -i "s#ghcr.io/nltimv/#ghcr.io/$OWNER/#g" "$chart/values.yaml"
          helm lint "$chart" --set secrets.mediaKeks=k1:AAAA
          helm package "$chart" --version "$VERSION" --app-version "$VERSION" -d dist
      - name: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/ai-vps-orchestrator-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"
      - name: tag the commit
        if: needs.version.outputs.latest == 'true'
        run: |
          git tag -f "v$VERSION" "$GITHUB_SHA"
          # a re-run of the same build keeps its version: the tag may already be there
          git push origin "v$VERSION" || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"
      - name: summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Images: \`ghcr.io/$OWNER/aivo-{backend,frontend,worker,worker-mock}:$VERSION\`

          Upgrade:
          \`\`\`bash
          helm upgrade --install aivo oci://ghcr.io/$OWNER/charts/ai-vps-orchestrator --version $VERSION -f my-values.yaml
          \`\`\`
          EOF
