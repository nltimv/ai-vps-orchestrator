[project]
name = "aivo-worker"
version = "0.1.0"
description = "aivo GPU worker agent: runs ComfyUI workflows pushed by the backend"
requires-python = ">=3.12"
dependencies = [
  "aivo-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pillow>=11",
  "websockets>=13",
]

[project.scripts]
aivo-worker = "aivo_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivo_worker"]
